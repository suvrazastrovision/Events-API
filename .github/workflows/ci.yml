name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Run container
        run: |
          docker run -d \
            --name events-api-container \
            -p 5000:5000 \
            events-api:latest

      - name: Wait for API and check health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:5000/api/health; then
              echo
              echo "Events API is healthy"
              exit 0
            fi

            echo "Waiting for Events API (attempt $attempt/15)..."
            sleep 2
          done

          echo "Events API failed to become healthy"
          docker logs events-api-container
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs events-api-container