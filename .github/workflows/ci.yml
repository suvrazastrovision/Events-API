name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Run container
        run: |
          docker run --detach \
            --name events-api-container \
            --publish 5000:5000 \
            events-api:latest

      - name: Wait for API
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:5000/api/health; then
              echo
              echo "Events API is healthy"
              exit 0
            fi

            echo "Waiting for API ($attempt/15)..."
            sleep 2
          done

          echo "API did not become healthy"
          docker logs events-api-container
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          BASE_URL: http://localhost:5000
        run: python -m pytest -v

      - name: Show container logs
        if: always()
        run: docker logs events-api-container || true

      - name: Stop and remove container
        if: always()
        run: docker rm --force events-api-container || true

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for Render rollout
        run: sleep 30

      - name: Smoke test deployed API
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          curl --fail --show-error --silent \
            "$RENDER_BASE_URL/api/health"